name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      create_release:
        description: "DNS Fetching"
        type: boolean
        default: false

permissions:
  contents: write

env:
  GO_VERSION: "1.22"
  APP_NAME: dns-fetching
  APPIMAGE_NAME: DNS_Fetching

jobs:
  build:
    name: Build Linux x86_64
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Determine version
        id: version
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            VERSION="${{ github.ref_name }}"
          else
            VERSION="dev-$(git rev-parse --short HEAD)"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "### Version: \`${VERSION}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc libgl1-mesa-dev xorg-dev libfuse2

      - name: Build binaries
        run: |
          LDFLAGS="-s -w -X main.version=${{ steps.version.outputs.version }}"
          CGO_ENABLED=1 go build -ldflags="${LDFLAGS}" -o ${{ env.APP_NAME }} .
          CGO_ENABLED=1 go build -ldflags="${LDFLAGS}" -o ${{ env.APP_NAME }}-helper ./cmd/helper/

      - name: Run tests
        run: go test ./... -v -race

      - name: Prepare AppDir
        run: |
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/applications

          cp ${{ env.APP_NAME }} AppDir/usr/bin/
          cp ${{ env.APP_NAME }}-helper AppDir/usr/bin/
          cp assets/dns-fetching.desktop AppDir/usr/share/applications/
          cp assets/dns-fetching.desktop AppDir/

          # icon handling
          if [ -f assets/icon.png ]; then
            mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps
            cp assets/icon.png AppDir/usr/share/icons/hicolor/256x256/apps/dns-fetching.png
            cp assets/icon.png AppDir/dns-fetching.png
            echo "ICON_FLAG=-i AppDir/dns-fetching.png" >> "$GITHUB_ENV"
          elif [ -f assets/icon.svg ]; then
            mkdir -p AppDir/usr/share/icons/hicolor/scalable/apps
            cp assets/icon.svg AppDir/usr/share/icons/hicolor/scalable/apps/dns-fetching.svg
            cp assets/icon.svg AppDir/dns-fetching.svg
            echo "ICON_FLAG=-i AppDir/dns-fetching.svg" >> "$GITHUB_ENV"
          else
            mkdir -p AppDir/usr/share/icons/hicolor/scalable/apps
            echo '<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256"></svg>' > AppDir/dns-fetching.svg
            cp AppDir/dns-fetching.svg AppDir/usr/share/icons/hicolor/scalable/apps/dns-fetching.svg
            echo "ICON_FLAG=-i AppDir/dns-fetching.svg" >> "$GITHUB_ENV"
          fi

      - name: Build AppImage
        run: |
          curl -fsSL -o linuxdeploy-x86_64.AppImage \
            "https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage"
          chmod +x linuxdeploy-x86_64.AppImage

          ./linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            -e AppDir/usr/bin/${{ env.APP_NAME }} \
            -d AppDir/usr/share/applications/dns-fetching.desktop \
            ${{ env.ICON_FLAG }} \
            --output appimage

      - name: Stage release assets
        id: assets
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          DIST="dist"
          mkdir -p "${DIST}"

          # rename binaries with version
          cp ${{ env.APP_NAME }}         "${DIST}/${{ env.APP_NAME }}-linux-amd64"
          cp ${{ env.APP_NAME }}-helper  "${DIST}/${{ env.APP_NAME }}-helper-linux-amd64"

          # rename AppImage
          APPIMAGE=$(ls ${{ env.APPIMAGE_NAME }}*.AppImage 2>/dev/null | head -1)
          if [ -n "${APPIMAGE}" ]; then
            cp "${APPIMAGE}" "${DIST}/${{ env.APPIMAGE_NAME }}-${VERSION}-x86_64.AppImage"
          fi

          # generate checksums
          cd "${DIST}"
          sha256sum * > checksums-sha256.txt
          cat checksums-sha256.txt

          echo "dist_path=${DIST}" >> "$GITHUB_OUTPUT"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-${{ steps.version.outputs.version }}-linux-amd64
          path: dist/*
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || inputs.create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: "${{ steps.version.outputs.version }}"
          body: |
            ## Installation

            ### AppImage (recommended)
            ```bash
            wget https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.version }}/${{ env.APPIMAGE_NAME }}-${{ steps.version.outputs.version }}-x86_64.AppImage
            chmod +x ${{ env.APPIMAGE_NAME }}-${{ steps.version.outputs.version }}-x86_64.AppImage
            ./${{ env.APPIMAGE_NAME }}-${{ steps.version.outputs.version }}-x86_64.AppImage
            ```

            ### Standalone binaries
            ```bash
            wget https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.version }}/${{ env.APP_NAME }}-linux-amd64
            wget https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.version }}/${{ env.APP_NAME }}-helper-linux-amd64
            chmod +x ${{ env.APP_NAME }}-linux-amd64 ${{ env.APP_NAME }}-helper-linux-amd64
            ```

            Verify checksums with `sha256sum -c checksums-sha256.txt`.
          files: dist/*
          fail_on_unmatched_files: false
          generate_release_notes: true
          draft: false
          prerelease: false
